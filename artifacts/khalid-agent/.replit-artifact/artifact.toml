kind = "web"
previewPath = "/"
title = "خالد سلمان - الوكيل الذكي"
version = "1.0.0"
id = "artifacts/khalid-agent"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18241

[services.development]
run = "pnpm --filter @workspace/khalid-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/khalid-agent", "run", "build" ]
publicDir = "artifacts/khalid-agent/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18241"
BASE_PATH = "/"
